; NRR plugin descriptor - Godot editor plugin format (INI).
;
; Godot's EditorPlugin path parses plugin.cfg as INI. This file previously
; shipped the Godot 3 XML variant, which Godot 4 does not read: the plugin
; never appeared under Project -> Project Settings -> Plugins and no editor
; code ever ran, while the phase checklist counted it as "configured".
;
; ShugoCore's Godot tests read this file directly and fail on the XML form
; (platforms/godot/../tests/test_xr_scaffold.py::TestPluginDescriptors), so a
; regression here is caught from the consuming side as well as from this
; repository (see tests/unit/test_engine_plugins.cpp).

[plugin]

name="NRR"
description="Neural Rendering Runtime (NRR) integration for Godot 4.x. Drives the portable NRR C API through a GDExtension binding, with a GDScript fallback that reports absence honestly instead of fabricating output."
author="NRR Project"
version="1.0.0"
script="nrr_plugin.gd"
