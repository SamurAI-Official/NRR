name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  ORT_VERSION: v1.30.0
  ORT_DIR: third_party/onnxruntime-win-x64-1.30.0

jobs:
  # ---------------------------------------------------------------------------
  # Primary gate: real ONNX Runtime (CPU EP), full test suite, all phase tests.
  # ---------------------------------------------------------------------------
  windows-build-test:
    name: Windows x64 - build + full test suite (ORT CPU EP)
    runs-on: windows-latest
    # A hung NRR process would otherwise occupy a runner for GitHub's 6-hour
    # default. The full suite is ~2 minutes on the runner; 30 is a fail-fast
    # ceiling, not a budget.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore ONNX Runtime SDK from cache
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ORT_DIR }}
          key: ort-win-x64-${{ env.ORT_VERSION }}

      - name: Fetch ONNX Runtime SDK
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/fetch_ort.ps1 -Version $env:ORT_VERSION

      - name: Verify ONNX Runtime SDK
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ORT_DIR/include/onnxruntime_c_api.h")) {
            throw "ONNX Runtime SDK missing - refusing to run the suite against the placeholder path."
          }
          Write-Host "ONNX Runtime SDK present at $env:ORT_DIR"

      - name: Configure, build and test
        shell: pwsh
        run: ./tools/build.ps1 -Config Release -RunTests

      # Then the same suite with the accelerator execution path forced on, so the whole test
      # surface - not only tests/integration/test_path_parity.cpp - runs through
      # AcceleratorExecutionKernel::execute_frame on a runner that has no accelerator. See
      # runtime/nrr_test_backend.h: the override decides what automatic selection resolves to,
      # and a red result here is a divergence between the two execution paths.
      - name: Run the suite over the accelerator execution path
        shell: pwsh
        env:
          NRR_TEST_BACKEND: kernel
        run: ./tools/build.ps1 -Config Release -NoConfigure -NoBuild -RunTests

      # Compile coverage for the configuration no other job builds: every vendor and mobile source
      # (NRR_ENABLE_MOBILE_VENDOR turns on the mobile feature branches) plus the Vulkan backend's
      # no-SDK branch, which - until this step existed - was compiled by *nothing* and was not even
      # a valid translation unit (see the note in CMakeLists.txt). Build only: the mobile vendor
      # tests assert the old "the flag means the vendor is supported" contract, which is recorded
      # as a follow-up in docs/roadmap.md.
      - name: Build the all-vendor / no-SDK-Vulkan configuration
        shell: pwsh
        run: |
          ./tools/build.ps1 -Config Release -BuildDir build-backends -Clean `
            -Define NRR_ENABLE_MOBILE_VENDOR=ON,NRR_ENABLE_NVIDIA=ON,NRR_ENABLE_RISCV=ON

      # Same reasoning as the CUDA job: a failing test name must be readable without
      # access to the job log.
      - name: Publish failing tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $logs = 'build/test-results'
          if (-not (Test-Path $logs)) {
            Write-Host "::warning::no test logs at $logs - the failure happened before the suite ran"
            exit 0
          }
          $found = $false
          Get-ChildItem $logs -Filter '*.log' | ForEach-Object {
            $name = $_.BaseName
            Select-String -Path $_.FullName -Pattern 'FAILED|FAILURE:|RESULT: FAIL' |
              Select-Object -First 25 | ForEach-Object {
                $found = $true
                Write-Host "::error title=$name::$($_.Line.Trim())"
              }
          }
          if (-not $found) {
            Write-Host "::warning::no FAILED line in the logs; publishing the suite summary instead"
            $suite = Join-Path $logs 'nrr_tests.log'
            if (Test-Path $suite) {
              Select-String -Path $suite -Pattern 'Total:|Passed:|Failed:|Success Rate' |
                ForEach-Object { Write-Host "::error title=nrr_tests summary::$($_.Line.Trim())" }
            }
          }
          exit 0

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: build/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Memory-safety gate: AddressSanitizer build of the runtime + test suite.
  #
  # Blocking since run #6 (2026-09-16), which was the first green ASan run: the
  # instrumented build links on the runner, the runtime DLL is deployed next to the
  # executables, and all six test executables pass under ASan with no findings.
  # Two failures had to be fixed first - see "M0 status detail: AddressSanitizer"
  # in docs/roadmap.md.
  #
  # The ASan build is a bug detector, not a performance gate.
  # ---------------------------------------------------------------------------
  windows-asan:
    name: Windows x64 - AddressSanitizer
    runs-on: windows-latest
    # ~30x the uninstrumented suite was 18 minutes because the 16 wall-clock
    # latency benchmarks (~255 renders at 256x256 -> 512x512) were being run
    # under instrumentation; they are skipped in this build now
    # (NRR_SKIP_TIMING_TESTS, see CMakeLists.txt). This ceiling still fails fast
    # if an instrumented process hangs.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Restore ONNX Runtime SDK from cache
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ORT_DIR }}
          key: ort-win-x64-${{ env.ORT_VERSION }}

      - name: Fetch ONNX Runtime SDK
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/fetch_ort.ps1 -Version $env:ORT_VERSION

      - name: Configure, build and test with AddressSanitizer
        shell: pwsh
        run: ./tools/build.ps1 -Config RelWithDebInfo -BuildDir build-asan -Sanitize -RunTests -Clean

      # If the sanitizer tests could not start (0xC0000135 = STATUS_DLL_NOT_FOUND does
      # not name the missing DLL), publish the resolved/ unresolved import list as
      # annotations - readable through the public check-run API without log access.
      - name: Diagnose unresolved runtime dependencies
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem build-asan -Recurse -Filter nrr_tests.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $exe) { Write-Host "::warning::no nrr_tests.exe found to inspect"; exit 0 }
          ./tools/diagnose_pe.ps1 -Binary $exe.FullName
          $dll = Get-ChildItem build-asan -Recurse -Filter nrr.dll -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($dll) { ./tools/diagnose_pe.ps1 -Binary $dll.FullName -ExtraSearchDirs @($exe.DirectoryName) }

      - name: Upload ASan test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-test-logs-${{ github.run_number }}
          path: build-asan/test-results/
          if-no-files-found: ignore


  # ---------------------------------------------------------------------------
  # GPU linkage gate: build, link and test against the CUDA ONNX Runtime.
  #
  # None of the CUDA path is compiled by the CPU-flavour job above:
  # SessionOptionsAppendExecutionProvider_CUDA, the provider-DLL-beside-
  # onnxruntime.dll deployment, the toolkit-free driver probe (nrr_cuda_driver)
  # and every #ifdef NRR_HAVE_CUDA_EP branch in the tests. Without a job that
  # builds this configuration it can rot silently until someone does it by hand -
  # which is precisely how the accelerator frame path came to be handing one input
  # to a three-input model while reporting no timings at all.
  #
  # GitHub-hosted runners have no GPU, so even with the CUDA runtime present the
  # provider cannot *attach* - the runtime means "loadable", the device means
  # "usable", and this job has the first without the second. What it therefore gates:
  # the CUDA configuration compiles and links, the provider and its runtime DLLs
  # resolve, and the fallback to the CPU provider is reported truthfully rather than
  # silently. A genuine attach (and the measured speedup) requires a self-hosted
  # runner with a GPU; `test_ep_active_provider_is_measured` cross-checks the reported
  # provider against probe_cuda_driver(), so a device-less host cannot claim CUDA even
  # if ONNX Runtime defers its own failure to session creation.
  #
  # Only the CUDA package is fetched here, so CMake's `auto` flavour detection is
  # deterministic and the CUDA import library is the one linked.
  # ---------------------------------------------------------------------------
  windows-gpu-link:
    name: Windows x64 - build + test against the CUDA ONNX Runtime
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      ORT_GPU_DIR: third_party/onnxruntime-win-x64-gpu_cuda12-1.30.0

    steps:
      - uses: actions/checkout@v4

      - name: Restore CUDA ONNX Runtime from cache
        id: ort-gpu-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ORT_GPU_DIR }}
          key: ort-win-x64-gpu_cuda12-${{ env.ORT_VERSION }}

      - name: Fetch CUDA ONNX Runtime
        if: steps.ort-gpu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/fetch_ort.ps1 -Flavor gpu_cuda12 -Version $env:ORT_VERSION

      - name: Verify the CUDA execution provider shipped
        shell: pwsh
        run: |
          $provider = Join-Path $env:ORT_GPU_DIR 'lib/onnxruntime_providers_cuda.dll'
          if (-not (Test-Path $provider)) {
            throw "CUDA provider missing from $env:ORT_GPU_DIR - refusing to report a GPU build."
          }
          $mb = [math]::Round((Get-Item $provider).Length / 1MB)
          Write-Host "CUDA execution provider present: $provider ($mb MB)"

      # The provider DLL alone is not enough: ORT loads it together with the CUDA
      # runtime, and without that it fails with "Failed to load shared library" and the
      # session silently lands on the CPU provider. Fetching the runtime is what makes
      # this a gate on the configuration users actually install, rather than a gate on
      # the fallback path. 2.3 GB, so it is cached.
      - name: Restore CUDA runtime from cache
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: third_party/cuda-runtime-cu12
          key: cuda-runtime-cu12-${{ env.ORT_VERSION }}

      - name: Fetch the CUDA runtime
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./tools/fetch_cuda_runtime.ps1

      - name: Verify the CUDA runtime resolved
        shell: pwsh
        run: |
          $bin = 'third_party/cuda-runtime-cu12/bin'
          $dll = Join-Path $bin 'cudart64_12.dll'
          if (-not (Test-Path $dll)) {
            throw "CUDA runtime missing at $dll - the CUDA execution provider cannot attach without it, so this job would only be exercising the fallback path."
          }
          $count = @(Get-ChildItem $bin -Filter '*.dll').Count
          $mb = [math]::Round((@(Get-ChildItem $bin -Filter '*.dll') |
            Measure-Object -Property Length -Sum).Sum / 1MB)
          Write-Host "CUDA runtime resolved: $count DLL(s), $mb MB, $dll present"

      - name: Configure, build and test against the CUDA provider
        shell: pwsh
        run: ./tools/build.ps1 -Config Release -BuildDir build-gpu -RunTests

      # The whole suite through the accelerator execution path (see runtime/nrr_test_backend.h).
      # On a device-less runner the frames run on the CPU provider with host-memory textures; on
      # a runner with a device the kernel attaches the CUDA provider, so this step covers the
      # accelerator path end to end either way.
      - name: Run the suite over the accelerator execution path
        shell: pwsh
        env:
          NRR_TEST_BACKEND: kernel
        run: ./tools/build.ps1 -Config Release -BuildDir build-gpu -NoConfigure -NoBuild -RunTests

      # Job logs need authentication, and the whole point of this job is to catch a
      # configuration-specific failure nobody can reproduce locally. Publish the
      # FAILED lines as annotations so they are readable through the public check-run
      # API - the same pattern the dependency diagnosis below uses.
      - name: Publish failing tests as annotations
        if: failure()
        shell: pwsh
        run: |
          $logs = 'build-gpu/test-results'
          if (-not (Test-Path $logs)) {
            Write-Host "::warning::no test logs at $logs - the failure happened before the suite ran"
            exit 0
          }
          $found = $false
          Get-ChildItem $logs -Filter '*.log' | ForEach-Object {
            $name = $_.BaseName
            Select-String -Path $_.FullName -Pattern 'FAILED|FAILURE:|RESULT: FAIL' |
              Select-Object -First 25 | ForEach-Object {
                $found = $true
                Write-Host "::error title=$name::$($_.Line.Trim())"
              }
          }
          if (-not $found) {
            Write-Host "::warning::no FAILED line in the logs; publishing the suite summary instead"
            $suite = Join-Path $logs 'nrr_tests.log'
            if (Test-Path $suite) {
              Select-String -Path $suite -Pattern 'Total:|Passed:|Failed:|Success Rate' |
                ForEach-Object { Write-Host "::error title=nrr_tests summary::$($_.Line.Trim())" }
            }
          }
          exit 0

      - name: Upload GPU-build test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-logs-${{ github.run_number }}
          path: build-gpu/test-results/
          if-no-files-found: ignore
